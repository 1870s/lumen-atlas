pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'net.fabricmc.fabric-loom' version "${loom_version}"
        id 'net.neoforged.moddev' version "${moddevgradle_version}"
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'lumenatlas'

// Minecraft independent logic (map codecs, clustering, waypoint storage...) with its unit tests.
include 'core-tests'

// One Fabric and one NeoForge project per supported Minecraft version, all compiled from the same common/ code.
// Each versions/<mc>/target.properties holds that version's Minecraft, loader and API versions.
// Add a version by creating versions/<mc>/ and listing it here (see docs/DEVELOPMENT.md).
def supportedVersions = providers.gradleProperty('lumen_versions').getOrElse('26.3').split(',')*.trim()
supportedVersions.each { mc ->
    ['fabric', 'neoforge'].each { loader ->
        include "${loader}-${mc}"
        project(":${loader}-${mc}").projectDir = file("versions/${mc}/${loader}")
    }
}
